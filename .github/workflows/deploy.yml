# Build the site with Eleventy and deploy it to GitHub Pages.
# Everything runs on GitHub: no third-party hosting or build service.
name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Tells us the real Pages URL + path prefix for THIS repo
      # (/zt-site-staging/ here, / on the live user site or a custom domain).
      - id: pages
        uses: actions/configure-pages@v5

      # Re-use already-encoded AVIF/WebP/JPEG derivatives between runs.
      - uses: actions/cache@v4
        with:
          path: _site/img
          key: img-${{ hashFiles('src/images/**', 'eleventy.config.js') }}
          restore-keys: img-

      - run: npm ci

      - name: Build
        run: npx @11ty/eleventy
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Advisory: Lighthouse on the real deployed home page (real network, so it varies run
  # to run). Median of 5 mobile runs goes in the job summary; below 95 raises a warning
  # annotation but never fails the deploy. The blocking checks are in the Quality gate.
  lighthouse-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Lighthouse, deployed home page (median of 5 mobile runs)
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          sleep 45  # let the Pages CDN pick up the new build
          for i in 1 2 3 4 5; do
            npx --yes lighthouse@12 "$URL" --only-categories=performance \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh-$i.json --quiet || true
          done
          node -e '
            const fs = require("fs");
            const runs = [1,2,3,4,5].filter(i => fs.existsSync(`lh-${i}.json`)).map(i => JSON.parse(fs.readFileSync(`lh-${i}.json`)));
            const s = runs.map(r => Math.round(r.categories.performance.score * 100));
            const tbt = runs.map(r => Math.round(r.audits["total-blocking-time"].numericValue));
            const med = [...s].sort((a, b) => a - b)[Math.floor(s.length / 2)];
            const line = `Deployed ${process.env.URL} mobile performance: median ${med} (runs ${s.join(", ")}; TBT ms ${tbt.join(", ")})`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            console.log(line);
            if (!s.length || med < 95) console.log(`::warning title=Deployed Lighthouse below 95::${line}`);
          '
