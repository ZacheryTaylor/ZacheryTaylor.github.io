# Build the site with Eleventy and deploy it to GitHub Pages.
# Everything runs on GitHub: no third-party hosting or build service.
name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Tells us the real Pages URL + path prefix for THIS repo
      # (/zt-site-staging/ here, / on the live user site or a custom domain).
      - id: pages
        uses: actions/configure-pages@v5

      # Re-use already-encoded AVIF/WebP/JPEG derivatives between runs.
      - uses: actions/cache@v4
        with:
          path: _site/img
          key: img-${{ hashFiles('src/images/**', 'eleventy.config.js') }}
          restore-keys: img-

      - run: npm ci

      - name: Build
        run: npx @11ty/eleventy
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
